<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Accès à ÉCLAT</title>
  <link rel="icon" href="/favicon.svg">
  <style>
    :root{--blue:#10243e;--blue2:#1c3a5b;--gold:#c5a35a;--terra:#b8654d;--cream:#f7f3ea;--paper:#fffdf8;--muted:#6c6b68}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--cream);color:#17202b;font-family:Arial,sans-serif;display:grid;place-items:center;padding:24px}
    .card{width:min(100%,460px);background:var(--paper);border:1px solid rgba(197,163,90,.55);border-radius:28px;padding:34px 28px;box-shadow:0 24px 70px rgba(16,36,62,.13)}
    .brand{display:flex;align-items:center;gap:13px;margin-bottom:34px;color:var(--blue)}
    .mark{width:52px;height:52px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-family:Georgia,serif;font-size:26px}
    .brand strong,.brand small{display:block}.brand strong{font-family:Georgia,serif;font-size:20px;font-weight:400}.brand small{margin-top:4px;color:var(--terra);font-size:11px;letter-spacing:.15em}
    .eyebrow{color:var(--terra);font-weight:700;letter-spacing:.17em;font-size:12px;text-transform:uppercase}
    h1{font-family:Georgia,serif;color:var(--blue);font-weight:400;font-size:40px;line-height:1.1;margin:13px 0}
    p{color:var(--muted);line-height:1.6;margin:0 0 26px}
    label{display:block;color:var(--blue);font-weight:700;margin-bottom:9px}
    input[type=password]{width:100%;min-height:54px;border:1px solid #d9d1c2;border-radius:14px;background:#fff;padding:12px 15px;font-size:18px;outline:none}
    input[type=password]:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(197,163,90,.18)}
    .remember{display:flex;align-items:center;gap:9px;margin:17px 0 22px;color:var(--muted);font-size:14px}
    .remember input{width:18px;height:18px;accent-color:var(--blue)}
    button{width:100%;border:0;border-radius:999px;padding:16px 20px;background:var(--blue);color:white;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 9px 22px rgba(16,36,62,.2)}
    button:disabled{opacity:.65;cursor:wait}
    .error{min-height:24px;color:#9c4b40;font-size:14px;margin-top:15px}
    .back{display:block;text-align:center;margin-top:18px;color:var(--blue);text-underline-offset:4px}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="mark">D’</span><span><strong>D’Âme &amp; de Sens</strong><small>MON PARCOURS ÉCLAT</small></span></div>
    <div class="eyebrow">Espace protégé</div>
    <h1>Bienvenue dans ÉCLAT</h1>
    <p>Entrez le mot de passe pour accéder à votre parcours.</p>
    <form id="loginForm">
      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <label class="remember"><input id="remember" type="checkbox"> Rester connectée sur cet appareil</label>
      <button id="submitButton" type="submit">Entrer dans ÉCLAT →</button>
      <div id="error" class="error" role="alert" aria-live="polite"></div>
    </form>
    <a class="back" href="https://dametdesens.com/outils">← Retour aux outils</a>
  </main>
  <script>
    const form=document.getElementById("loginForm");
    const button=document.getElementById("submitButton");
    const error=document.getElementById("error");
    form.addEventListener("submit",async(event)=>{
      event.preventDefault();
      error.textContent="";
      button.disabled=true;
      button.textContent="Connexion…";
      try{
        const response=await fetch("/api/auth/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:form.password.value,remember:document.getElementById("remember").checked})});
        const data=await response.json().catch(()=>({}));
        if(!response.ok)throw new Error(data.message||"Connexion impossible.");
        const params=new URLSearchParams(location.search);
        const requested=params.get("retour")||"/";
        const destination=requested.startsWith("/")&&!requested.startsWith("//")?requested:"/";
        location.replace(destination);
      }catch(reason){
        error.textContent=reason instanceof Error?reason.message:"Connexion impossible.";
        button.disabled=false;
        button.textContent="Entrer dans ÉCLAT →";
        form.password.focus();
        form.password.select();
      }
    });
  </script>
</body>
</html>
